name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build
        run: dotnet build ClipForge.sln -c Release --nologo

      - name: Publish single-file
        run: dotnet publish src/ClipForge.App/ClipForge.App.csproj -c Release -r win-x64 --self-contained -o dist --nologo

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: clipforge-win-x64
          path: dist/ClipForge.exe

name: build

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # Strictness pack (Directory.Build.props) runs here: nullable, TWAE,
      # AnalysisMode All, Meziantou, VSTHRD, IDISP, BannedApi, STRICT0001.
      # Warnings are errors — a red build means the rules caught something.
      - name: Build
        run: dotnet build ClipForge.sln -c Release --nologo

      - name: Publish (Fast profile)
        run: dotnet publish src/ClipForge.App/ClipForge.App.csproj -c Release /p:PublishProfile=Fast --nologo

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: clipforge-win-x64
          path: src/ClipForge.App/bin/Release/publish/
